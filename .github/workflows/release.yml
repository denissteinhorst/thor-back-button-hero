name: Release

# Tag format is v<versionName> (e.g. v1.3.0), matching defaultConfig.versionName in
# app/build.gradle.kts - UpdateChecker.kt parses this tag to decide if a newer
# release exists. Bump versionName and versionCode before tagging.
on:
  push:
    tags:
      - "v*"

jobs:
  build-sign-release:
    runs-on: ubuntu-24.04
    # The repository default for GITHUB_TOKEN is read-only, which makes creating a
    # release fail with "Resource not accessible by integration". Grant the write scope
    # here rather than repo-wide, so every other workflow keeps the read-only default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Compiles the root input helper (app/src/main/cpp); keep in sync with ndkVersion in app/build.gradle.kts.
      - name: Install NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" > /dev/null

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      # UpdateChecker compares the tag against the installed versionName, so a tag that is
      # not exactly v<versionName> makes every installed app miss this release for good.
      # versionCode must still rise independently - Android uses it to order upgrades.
      # Fail before publishing rather than shipping an undetectable release.
      - name: Verify tag matches versionName
        run: |
          version="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match versionName $version (expected 'v$version')." >&2
            echo "UpdateChecker would never detect this release. Fix the tag or versionName." >&2
            exit 1
          fi
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "versionName '$version' is not semver (major.minor.patch)." >&2
            exit 1
          fi
          echo "Tag '$GITHUB_REF_NAME' matches versionName $version."

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore

      # Ship a self-describing filename instead of the generic app-release.apk, so a
      # downloaded or side-loaded file still says which version it is.
      - name: Name the APK after the app and its version
        id: apk
        run: |
          version="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')"
          asset="thor-back-button-hero-v${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "Release asset: $asset"

      # The explainer ships as a release asset because raw.githubusercontent serves
      # repository HTML as text/plain with nosniff, so a link to it shows source instead
      # of the page. Release assets carry Content-Disposition: attachment and download
      # properly, which keeps releases/latest/download/gesture-explainer.html working.
      - name: Create GitHub release with APK and gesture explainer
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.apk.outputs.asset }}
            docs/gesture-explainer.html
          generate_release_notes: true
